services:
  query:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
    command: ["python", "query_mongo.py"]

  loader:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
    command: ["python", "loader.py"]

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ./:/app
    command: ["python", "news_extractor.py"]
